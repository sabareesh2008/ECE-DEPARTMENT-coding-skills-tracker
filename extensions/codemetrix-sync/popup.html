<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeMetrix Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <span class="logo-icon">⚡</span>
      <div class="logo-text">
        <h1>CodeMetrix</h1>
        <p>ECE LeetCode Sync</p>
      </div>
    </div>
    <div class="status-indicator not-ready" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Setup Needed</span>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="regNumber">Register Number *</label>
      <input type="text" id="regNumber" placeholder="e.g. 922525106264" maxlength="12">
      <small id="studentNameHint" class="hint"></small>
    </div>

    <div class="form-group">
      <label for="leetcodeInput">LeetCode Username</label>
      <input type="text" id="leetcodeInput" placeholder="e.g. sabareesh_karikalan">
      <small class="sub-hint">Auto-detected on leetcode.com if left blank</small>
    </div>

    <div class="form-group checkbox-group">
      <label for="autoSyncToggle" class="switch-label">
        <span>Sync on 100% Passed (Accepted only)</span>
        <input type="checkbox" id="autoSyncToggle" checked>
      </label>
    </div>

    <button id="saveBtn" class="btn btn-primary">Save Profile</button>
    <div id="saveMsg" class="msg"></div>
  </div>

  <div class="card stats-card">
    <div class="stat-item">
      <span class="stat-label">Accepted Solutions Synced</span>
      <span class="stat-val" id="syncCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Destination</span>
      <span class="stat-val-dest">Supabase DB</span>
    </div>
  </div>

  <div class="footer">
    <span>Department of ECE</span> &bull; <span>CodeMetrix Platform</span>
  </div>

  <script src="students_data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
