<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeMetrix Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <span class="logo-icon">⚡</span>
      <div class="logo-text">
        <h1>CodeMetrix</h1>
        <p>ECE LeetCode Sync</p>
      </div>
    </div>
    <div class="status-indicator not-ready" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Setup Needed</span>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="regNumber">Register Number *</label>
      <input type="text" id="regNumber" placeholder="e.g. 922525106264" maxlength="12">
      <small id="studentNameHint" class="hint"></small>
    </div>

    <div class="form-group">
      <label for="leetcodeInput">LeetCode Username</label>
      <input type="text" id="leetcodeInput" placeholder="e.g. sabareesh_karikalan">
      <small class="sub-hint">Auto-detected on leetcode.com if left blank</small>
    </div>

    <div class="form-group checkbox-group">
      <label for="autoSyncToggle" class="switch-label">
        <span>Automatic Sync on Submit</span>
        <input type="checkbox" id="autoSyncToggle" checked>
      </label>
    </div>

    <button id="saveBtn" class="btn btn-primary">Save Profile</button>
    <div id="saveMsg" class="msg"></div>
  </div>

  <div class="card stats-card">
    <div class="stat-item">
      <span class="stat-label">Captured Solutions</span>
      <span class="stat-val" id="syncCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Last Synced</span>
      <span class="stat-val-small" id="lastSynced">None</span>
    </div>
  </div>

  <!-- Recent Solutions Viewer -->
  <div class="card solutions-card">
    <div class="solutions-header">
      <h3>📋 Synced Code Archive</h3>
      <button id="refreshSolutionsBtn" class="btn-icon" title="Refresh solutions">⟳</button>
    </div>
    <div id="solutionsList" class="solutions-list">
      <div class="empty-state">No synced solutions yet. Solve a problem on LeetCode to see your code here!</div>
    </div>
  </div>

  <!-- Code Modal View -->
  <div id="codeModal" class="code-modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h4 id="modalProblemTitle">Problem Title</h4>
        <button id="closeModalBtn" class="btn-close">&times;</button>
      </div>
      <div class="modal-meta">
        <span id="modalLangBadge" class="badge">Python3</span>
        <span id="modalRuntimeBadge" class="badge">0 ms</span>
        <span id="modalTime" class="badge-time"></span>
      </div>
      <pre><code id="modalSourceCode"></code></pre>
      <button id="copyCodeBtn" class="btn btn-secondary">Copy Source Code</button>
    </div>
  </div>

  <div class="footer">
    <span>Department of ECE</span> &bull; <span>CodeMetrix Platform</span>
  </div>

  <script src="students_data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
