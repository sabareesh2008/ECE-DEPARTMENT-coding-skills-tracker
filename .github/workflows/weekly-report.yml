name: Weekly ECE Section-wise Performance Reports

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: ece-weekly-section-email-reports
  cancel-in-progress: false

jobs:
  send-weekly-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send section-wise weekly reports
        env:
          SEND_EMAIL: "false"
          SEND_WHATSAPP: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_ECE_A_EMAILS: ${{ secrets.REPORT_ECE_A_EMAILS }}
          REPORT_ECE_B_EMAILS: ${{ secrets.REPORT_ECE_B_EMAILS }}
          REPORT_ECE_C_EMAILS: ${{ secrets.REPORT_ECE_C_EMAILS }}
          REPORT_ECE_D_EMAILS: ${{ secrets.REPORT_ECE_D_EMAILS }}
          REPORT_ECE_E_EMAILS: ${{ secrets.REPORT_ECE_E_EMAILS }}
          REPORT_ECE_F_EMAILS: ${{ secrets.REPORT_ECE_F_EMAILS }}
          REPORT_HOD_EMAILS: ${{ secrets.REPORT_HOD_EMAILS }}
          REPORT_TO_EMAILS: ${{ secrets.REPORT_TO_EMAILS }}
          REPORT_REPLY_TO: ${{ secrets.REPORT_REPLY_TO }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_API_VERSION: ${{ secrets.WHATSAPP_API_VERSION }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_DAILY_TEMPLATE: ${{ secrets.WHATSAPP_DAILY_TEMPLATE }}
          WHATSAPP_WEEKLY_TEMPLATE: ${{ secrets.WHATSAPP_WEEKLY_TEMPLATE }}
          WHATSAPP_ECE_A_NUMBER: ${{ secrets.WHATSAPP_ECE_A_NUMBER }}
          WHATSAPP_ECE_B_NUMBER: ${{ secrets.WHATSAPP_ECE_B_NUMBER }}
          WHATSAPP_ECE_C_NUMBER: ${{ secrets.WHATSAPP_ECE_C_NUMBER }}
          WHATSAPP_ECE_D_NUMBER: ${{ secrets.WHATSAPP_ECE_D_NUMBER }}
          WHATSAPP_ECE_E_NUMBER: ${{ secrets.WHATSAPP_ECE_E_NUMBER }}
          WHATSAPP_ECE_F_NUMBER: ${{ secrets.WHATSAPP_ECE_F_NUMBER }}
          WHATSAPP_HOD_NUMBER: ${{ secrets.WHATSAPP_HOD_NUMBER }}
        run: python report_generator.py --mode weekly

      - name: Upload generated reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: weekly-section-email-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
