name: Update LeetCode Leaderboard

on:
  schedule:
    - cron: "*/5 * * * *"
    # Daily IST boundary snapshot: 00:00 IST = 18:30 UTC
    - cron: "30 18 * * *"

  workflow_dispatch:

  # Run when tracker code or dependencies change
  push:
    branches:
      - main
    paths:
      - "tracker.py"
      - "faculty_tracker.py"
      - "github_tracker.py"
      - ".github/workflows/update-leetcode.yml"
      - ".github/workflows/github-tracker.yml"
      - "requirements.txt"

permissions:
  contents: write

# Prevent multiple tracker jobs from running simultaneously
concurrency:
  group: codemetrix-tracker
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install Python packages
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. Run all CodeMetrix trackers
      # ------------------------------------------------------
      - name: Update LeetCode, Faculty and GitHub trackers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TRACKER_TOKEN: ${{ secrets.CODEMETRIX_GITHUB_TOKEN || github.token }}
          LEETCODE_TRACKER_WORKERS: "20"
          GITHUB_TRACKER_WORKERS: "20"
        run: |
          python tracker.py
          python faculty_tracker.py
          python github_tracker.py

      # ------------------------------------------------------
      # 5. Commit generated files
      # ------------------------------------------------------
      - name: Commit generated dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add students.csv Students.xlsx LiveData.csv History.csv DailyActivity.csv LeetCodeErrors.csv github_students.csv GitHubLiveData.csv GitHubHistory.csv GitHubDailyActivity.csv GitHubErrors.csv

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git commit -m "Auto update CodeMetrix trackers"

          git pull --rebase origin main

          git push origin main